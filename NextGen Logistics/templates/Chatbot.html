<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Chatbot</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f4; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        .chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            background: white;
        }
        .chatbox {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 50px;
        }
        .user-message {
            background: #ff7f50;
            color: white;
            padding: 10px;
            border-radius: 15px;
            max-width: 70%;
            align-self: flex-end;
            margin: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .bot-message {
            background: #6a5acd;
            color: white;
            padding: 10px;
            border-radius: 15px;
            max-width: 70%;
            align-self: flex-start;
            margin: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .input-box {
            display: flex;
            width: 60%;
            padding: 10px;
            background: white;
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 20px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }
        input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 15px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 16px;
        }
        button {
            padding: 10px 14px;
            margin-left: 5px;
            border-radius: 15px;
            border: none;
            background: #6a5acd;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chatbox" id="chatbox"></div>
    </div>
    <div class="input-box">
        <input type="text" id="user-input" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        function sendMessage() {
            let userText = document.getElementById("user-input").value;
            if (userText.trim() === "") return;

            let chatbox = document.getElementById("chatbox");
            chatbox.innerHTML += `<div class='user-message'>${userText}</div>`;

            fetch("/webhook", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userText })
            })
            .then(response => response.json())
            .then(data => {
                chatbox.innerHTML += `<div class='bot-message'>${data.reply}</div>`;
                chatbox.scrollTop = chatbox.scrollHeight;
            })
            .catch(error => {
                chatbox.innerHTML += `<div class='bot-message'>Oops! Something went wrong.</div>`;
                console.error("Error:", error);
            });

            document.getElementById("user-input").value = "";
        }
    </script>
</body>
</html>
